    <!-- JavaScript Logic -->
    <script>
        let repaymentChartInstance = null;

        // 원 단위 포맷터
        const krwFormatter = new Intl.NumberFormat('ko-KR');

        // 입력 폼 금액 자동 콤마 및 한글 변환
        function formatAmount(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value) {
                input.value = krwFormatter.format(value);
                // 우측 상단 실시간 변환액 표시 (단위: 원)
                const realAmount = parseInt(value, 10) * 10000;
                document.getElementById('amountDisplay').textContent = numberToKorean(realAmount) + '원';
            } else {
                input.value = '';
                document.getElementById('amountDisplay').textContent = '0 원';
            }
        }

        // 금액 버튼 추가 로직 (입력값이 '만원' 단위임을 주의)
        function addAmount(addValue) {
            const input = document.getElementById('loanAmount');
            let currentVal = parseInt(input.value.replace(/[^0-9]/g, '') || '0', 10);
            currentVal += addValue;
            input.value = krwFormatter.format(currentVal);
            formatAmount(input); // 한글 변환 업데이트 트리거
        }

        function clearAmount() {
            const input = document.getElementById('loanAmount');
            input.value = '';
            formatAmount(input);
        }

        // 숫자를 한국어 금액 단위로 변환 (예: 1억 5,000만)
        function numberToKorean(number) {
            if (number === 0) return '0';
            const unitWords = ['', '만', '억', '조', '경'];
            const splitUnit = 10000;
            let splitCount = unitWords.length;
            let resultArray = [];
            let resultString = '';

            for (let i = 0; i < splitCount; i++) {
                let unitResult = (number % Math.pow(splitUnit, i + 1)) / Math.pow(splitUnit, i);
                unitResult = Math.floor(unitResult);
                if (unitResult > 0) {
                    resultArray[i] = krwFormatter.format(unitResult);
                }
            }

            for (let i = 0; i < resultArray.length; i++) {
                if (!resultArray[i]) continue;
                resultString = String(resultArray[i]) + unitWords[i] + ' ' + resultString;
            }
            return resultString.trim();
        }

        // 만기일시상환 선택 시 거치기간 처리 방지/안내 로직
        function toggleGraceWarning() {
            const method = document.querySelector('input[name="repayMethod"]:checked').value;
            const graceInput = document.getElementById('gracePeriod');
            const graceUnit = document.getElementById('graceUnit');
            
            if (method === '만기일시') {
                graceInput.value = '0';
                graceInput.disabled = true;
                graceUnit.disabled = true;
                graceInput.parentElement.classList.add('opacity-50');
            } else {
                graceInput.disabled = false;
                graceUnit.disabled = false;
                graceInput.parentElement.classList.remove('opacity-50');
            }
        }

        // 주 계산 함수
        function calculateLoan() {
            // 1. 값 가져오기
            const rawAmount = document.getElementById('loanAmount').value.replace(/[^0-9]/g, '');
            const termVal = parseInt(document.getElementById('loanTerm').value, 10);
            const termUnit = document.getElementById('termUnit').value;
            const graceVal = parseInt(document.getElementById('gracePeriod').value, 10) || 0;
            const graceUnit = document.getElementById('graceUnit').value;
            const rateVal = parseFloat(document.getElementById('interestRate').value);
            const method = document.querySelector('input[name="repayMethod"]:checked').value;

            // 유효성 검사
            if (!rawAmount || parseInt(rawAmount) <= 0) return alert("대출 금액을 입력해주세요.");
            if (!termVal || termVal <= 0) return alert("대출 기간을 입력해주세요.");
            if (!rateVal || rateVal <= 0) return alert("연 이자율을 입력해주세요.");

            // 총 원금(원 단위)
            const P = parseInt(rawAmount, 10) * 10000;
            
            // 기간을 개월 수로 통일
            const totalMonths = termUnit === 'year' ? termVal * 12 : termVal;
            const graceMonths = method === '만기일시' ? 0 : (graceUnit === 'year' ? graceVal * 12 : graceVal);

            if (graceMonths >= totalMonths && method !== '만기일시') {
                return alert("거치기간은 대출기간보다 짧아야 합니다.");
            }

            // 월 이자율
            const monthlyRate = (rateVal / 100) / 12;
            const repayMonths = totalMonths - graceMonths; // 실제 원금을 상환하는 기간

            let schedule = [];
            let currentBalance = P;
            let totalInterest = 0;
            let totalPrincipal = 0;

            // 2. 상환 스케줄 계산 로직
            for (let m = 1; m <= totalMonths; m++) {
                // 매월 이자 (원단위 절사 - 금융권 일반 기준)
                let interest = Math.floor(currentBalance * monthlyRate);
                let principal = 0;

                // 거치기간 여부
                let isGrace = m <= graceMonths;

                if (method === '만기일시') {
                    if (m === totalMonths) principal = currentBalance;
                } 
                else if (method === '원금균등') {
                    if (!isGrace) {
                        // 마지막 달 단수 차이 조정
                        if (m === totalMonths) {
                            principal = currentBalance;
                        } else {
                            principal = Math.floor(P / repayMonths);
                        }
                    }
                } 
                else if (method === '원리금균등') {
                    if (!isGrace) {
                        // 원리금균등 월 납입금 (PMT)
                        // 공식: P * i * (1+i)^n / ((1+i)^n - 1)
                        const pmt = Math.floor((P * monthlyRate * Math.pow(1 + monthlyRate, repayMonths)) / (Math.pow(1 + monthlyRate, repayMonths) - 1));
                        
                        principal = pmt - interest;
                        // 마지막 달 잔액 털기
                        if (m === totalMonths) {
                            principal = currentBalance;
                        }
                    }
                }

                let monthlyPayment = principal + interest;
                currentBalance -= principal;
                // 미세한 소수점 오차로 마이너스 방지
                if (currentBalance < 0) currentBalance = 0;

                totalInterest += interest;
                totalPrincipal += principal;

                schedule.push({
                    month: m,
                    principal: principal,
                    interest: interest,
                    payment: monthlyPayment,
                    balance: currentBalance
                });
            }

            // 3. UI 업데이트
            renderResults(schedule, P, totalInterest, method);
        }

        // 결과 화면 렌더링
        function renderResults(schedule, principal, totalInterest, method) {
            // UI Toggle
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultSummary').classList.remove('hidden');
            document.getElementById('resultDetails').classList.remove('hidden');
            document.getElementById('resultDetails').classList.add('flex');

            const totalRepayment = principal + totalInterest;

            // Summary Text
            document.getElementById('resPrincipal').textContent = krwFormatter.format(principal) + '원';
            document.getElementById('resInterest').textContent = krwFormatter.format(totalInterest) + '원';
            document.getElementById('resTotal').textContent = krwFormatter.format(totalRepayment) + '원';
            
            // 첫 달 금액 (원리금균등이고 거치기간 없으면 매달 동일, 아니면 첫달 기준)
            const firstPayment = schedule[0].payment;
            document.getElementById('resFirstMonth').textContent = krwFormatter.format(firstPayment) + '원';

            let desc = "첫 달 납입 금액 (1회차)";
            if (method === '원리금균등' && schedule[0].principal > 0) desc = "매월 납입 금액 (균등)";
            if (method === '만기일시') desc = "매월 납입 이자";
            document.getElementById('resDescText').textContent = desc;

            // Table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let htmlBuffer = '';
            
            schedule.forEach(row => {
                htmlBuffer += `
                    <tr class="hover:bg-blue-50/50 transition-colors">
                        <td class="px-4 py-2.5 border-b text-center text-slate-500 font-medium">${row.month}회차</td>
                        <td class="px-4 py-2.5 border-b">${krwFormatter.format(row.principal)}원</td>
                        <td class="px-4 py-2.5 border-b">${krwFormatter.format(row.interest)}원</td>
                        <td class="px-4 py-2.5 border-b font-bold text-mg-blue bg-blue-50/20">${krwFormatter.format(row.payment)}원</td>
                        <td class="px-4 py-2.5 border-b text-slate-500">${krwFormatter.format(row.balance)}원</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlBuffer;

            // Chart Update
            renderChart(schedule);
        }

        function renderChart(schedule) {
            const ctx = document.getElementById('repaymentChart').getContext('2d');
            
            // 데이터 추출 (성능과 가독성을 위해 데이터가 많을 경우 샘플링하거나 요약할 수 있으나 최대 360개는 Chart.js에서 처리 가능)
            const labels = schedule.map(s => `${s.month}회`);
            const principalData = schedule.map(s => s.principal);
            const interestData = schedule.map(s => s.interest);
            const balanceData = schedule.map(s => s.balance);

            if (repaymentChartInstance) {
                repaymentChartInstance.destroy();
            }

            repaymentChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'line',
                            label: '대출 잔액',
                            data: balanceData,
                            borderColor: '#009944', // MG Green
                            backgroundColor: '#009944',
                            borderWidth: 2,
                            tension: 0.1,
                            yAxisID: 'y1',
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            type: 'bar',
                            label: '상환 원금',
                            data: principalData,
                            backgroundColor: '#025492', // MG Blue
                            stacked: true,
                            yAxisID: 'y'
                        },
                        {
                            type: 'bar',
                            label: '이자',
                            data: interestData,
                            backgroundColor: '#93c5fd', // Light Blue
                            stacked: true,
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 8,
                                font: { family: "'Pretendard', sans-serif" }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    if (context.parsed.y !== null) {
                                        label += krwFormatter.format(context.parsed.y) + '원';
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            stacked: true,
                            title: { display: true, text: '납입 금액 (원)', font: { size: 10 } },
                            ticks: {
                                callback: function(value) {
                                    if (value >= 10000) return krwFormatter.format(value / 10000) + '만';
                                    return krwFormatter.format(value);
                                }
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: '대출 잔액 (원)', font: { size: 10 } },
                            ticks: {
                                callback: function(value) {
                                    if (value >= 10000) return krwFormatter.format(value / 10000) + '만';
                                    return krwFormatter.format(value);
                                }
                            }
                        }
                    }
                }
            });
        }

        // 간단한 엑셀 다운로드 (CSV)
        function downloadExcel() {
            const table = document.getElementById("scheduleTable");
            let csv = [];
            for (let i = 0; i < table.rows.length; i++) {
                let row = [], cols = table.rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) {
                    // 콤마, '원' 제거
                    let data = cols[j].innerText.replace(/,/g, '').replace(/원/g, '');
                    row.push(data);
                }
                csv.push(row.join(","));
            }
            
            // BOM for UTF-8 Excel support
            const csvData = new Blob(['\uFEFF' + csv.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(csvData);
            link.setAttribute("href", url);
            link.setAttribute("download", "MG_대출상환스케줄.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
