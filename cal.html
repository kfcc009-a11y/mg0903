<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 맞춤형 대출 상환 계산기</title>
    <style>
        :root {
            --mg-blue: #004889;
            --mg-light-blue: #eef5fb;
            --mg-green: #009E54;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            --bg-color: #f7f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--mg-blue);
            color: #ffffff;
            padding: 20px 30px;
            text-align: center;
            border-bottom: 4px solid var(--mg-green);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
        }

        .input-section {
            flex: 1 1 350px;
            padding: 30px;
            border-right: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .result-section {
            flex: 2 1 450px;
            padding: 30px;
            background-color: var(--mg-light-blue);
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--mg-blue);
        }

        .unit {
            white-space: nowrap;
            color: var(--text-muted);
            font-weight: 600;
        }

        .quick-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .quick-btn {
            flex: 1;
            padding: 8px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .quick-btn:hover {
            background: var(--border-color);
        }

        .btn-calc {
            width: 100%;
            padding: 15px;
            background-color: var(--mg-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-calc:hover {
            background-color: #003666;
        }

        /* Results UI */
        .summary-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            border: 1px solid #e0e8f0;
        }

        .summary-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--mg-blue);
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .summary-item label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
        }

        .summary-item .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .dsr-highlight {
            color: var(--mg-green);
        }

        .table-container {
            background: #ffffff;
            border-radius: 8px;
            overflow: auto;
            max-height: 400px;
            border: 1px solid #e0e8f0;
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        thead {
            position: sticky;
            top: 0;
            background-color: var(--mg-blue);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            font-weight: 600;
            text-align: right;
        }
        
        th:first-child, td:first-child {
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f9fbfc;
        }

        @media (max-width: 768px) {
            .input-section { border-right: none; border-bottom: 1px solid var(--border-color); }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MG 맞춤형 대출 상환 계산기</h1>
    </div>
    
    <div class="content">
        <div class="input-section">
            <div class="form-group">
                <label>대출 금액</label>
                <div class="input-wrapper">
                    <input type="number" id="loanAmount" placeholder="예: 10000" min="0">
                    <span class="unit">만원</span>
                </div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="addAmount(100)">+100만</button>
                    <button class="quick-btn" onclick="addAmount(500)">+500만</button>
                    <button class="quick-btn" onclick="addAmount(1000)">+1,000만</button>
                    <button class="quick-btn" onclick="clearAmount()">초기화</button>
                </div>
            </div>

            <div class="form-group">
                <label>대출 기간</label>
                <div class="input-wrapper">
                    <input type="number" id="loanTerm" placeholder="예: 24" min="1">
                    <select id="termUnit" style="width: 80px;">
                        <option value="12">년</option>
                        <option value="1">개월</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>연 이자율</label>
                <div class="input-wrapper">
                    <input type="number" id="interestRate" placeholder="예: 5.5" step="0.01" min="0">
                    <span class="unit">%</span>
                </div>
            </div>

            <div class="form-group">
                <label>거치 기간 (이자만 납입하는 기간)</label>
                <div class="input-wrapper">
                    <input type="number" id="gracePeriod" placeholder="예: 0 (없음)" value="0" min="0">
                    <span class="unit">년</span>
                </div>
            </div>

            <div class="form-group">
                <label>상환 방식</label>
                <select id="repaymentMethod">
                    <option value="equal_pi">원리금균등분할상환</option>
                    <option value="equal_p">원금균등분할상환</option>
                    <option value="bullet">만기일시상환</option>
                </select>
            </div>

            <div class="form-group">
                <label>연 소득 (DSR 산출용)</label>
                <div class="input-wrapper">
                    <input type="number" id="annualIncome" placeholder="예: 5000" min="0">
                    <span class="unit">만원</span>
                </div>
            </div>

            <button class="btn-calc" onclick="calculateLoan()">계산하기</button>
        </div>

        <div class="result-section">
            <div class="summary-card">
                <div class="summary-title">📊 상환 요약</div>
                <div class="summary-grid">
                    <div class="summary-item">
                        <label>1회차 월 상환액</label>
                        <div class="value" id="firstPayment">0 원</div>
                    </div>
                    <div class="summary-item">
                        <label>총 이자 합계</label>
                        <div class="value" id="totalInterest">0 원</div>
                    </div>
                    <div class="summary-item">
                        <label>총 상환 금액</label>
                        <div class="value" id="totalPayment">0 원</div>
                    </div>
                    <div class="summary-item">
                        <label>예상 DSR (해당 대출 기준)</label>
                        <div class="value dsr-highlight" id="dsrValue">0.00 %</div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th>회차</th>
                            <th>상환 원금</th>
                            <th>대출 이자</th>
                            <th>월 납입금</th>
                            <th>대출 잔액</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #999;">계산기를 실행해 주세요.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // 금액 원터치 버튼 로직
    function addAmount(val) {
        const input = document.getElementById('loanAmount');
        const currentVal = parseInt(input.value) || 0;
        input.value = currentVal + val;
    }

    function clearAmount() {
        document.getElementById('loanAmount').value = '';
    }

    // 통화 포맷 (KRW)
    function formatCurrency(num) {
        return Math.round(num).toLocaleString('ko-KR');
    }

    // 주 계산 로직
    function calculateLoan() {
        // 입력값 가져오기
        const amountManWon = parseFloat(document.getElementById('loanAmount').value);
        const termInput = parseInt(document.getElementById('loanTerm').value);
        const termUnit = parseInt(document.getElementById('termUnit').value);
        const ratePercent = parseFloat(document.getElementById('interestRate').value);
        const graceYears = parseInt(document.getElementById('gracePeriod').value) || 0;
        const method = document.getElementById('repaymentMethod').value;
        const incomeManWon = parseFloat(document.getElementById('annualIncome').value) || 0;

        // 유효성 검사
        if (!amountManWon || !termInput || !ratePercent) {
            alert('대출금액, 대출기간, 연이자율을 정확히 입력해주세요.');
            return;
        }

        // 단위 변환 로직
        const P = amountManWon * 10000; // 원금 (원 단위)
        const totalMonths = termInput * termUnit; // 총 대출 개월 수
        const graceMonths = graceYears * 12; // 거치 개월 수
        const r = (ratePercent / 100) / 12; // 월 이자율
        const income = incomeManWon * 10000; // 연소득 (원 단위)

        if (graceMonths >= totalMonths && method !== 'bullet') {
            alert('거치기간은 대출기간보다 작아야 합니다.');
            return;
        }

        const repaymentMonths = totalMonths - graceMonths; 
        
        let schedule = [];
        let balance = P;
        let totalInterest = 0;
        
        let firstPaymentVal = 0;

        // 스케줄 생성
        for (let i = 1; i <= totalMonths; i++) {
            let principalPayment = 0;
            let interestPayment = balance * r;
            let isGrace = i <= graceMonths;

            if (method === 'bullet') {
                // 만기일시상환 (거치기간 무시, 마지막 달에 원금 전액 상환)
                if (i === totalMonths) {
                    principalPayment = P;
                } else {
                    principalPayment = 0;
                }
            } else if (isGrace) {
                // 거치기간 중 (원금 0)
                principalPayment = 0;
            } else {
                // 원리금균등 or 원금균등
                if (method === 'equal_pi') {
                    // 원리금균등분할상환
                    const pmt = (P * r * Math.pow(1 + r, repaymentMonths)) / (Math.pow(1 + r, repaymentMonths) - 1);
                    principalPayment = pmt - interestPayment;
                } else if (method === 'equal_p') {
                    // 원금균등분할상환
                    principalPayment = P / repaymentMonths;
                }
            }

            // 마지막 달 오차 보정
            if (i === totalMonths || principalPayment > balance) {
                principalPayment = balance;
            }

            let monthlyPayment = principalPayment + interestPayment;
            balance -= principalPayment;
            totalInterest += interestPayment;
            
            // 첫 달 납입액 저장 (요약용)
            if (i === 1) firstPaymentVal = monthlyPayment;

            schedule.push({
                round: i,
                principal: principalPayment,
                interest: interestPayment,
                payment: monthlyPayment,
                balance: Math.max(0, balance)
            });
        }

        // DSR 산출 로직 (현재 대출의 연간 평균 원리금 상환액 / 연소득)
        let dsr = 0;
        if (income > 0) {
            const totalPaymentAll = P + totalInterest;
            const years = totalMonths / 12;
            const annualRepaymentAverage = totalPaymentAll / years;
            dsr = (annualRepaymentAverage / income) * 100;
        }

        // 결과 렌더링
        renderResults(firstPaymentVal, totalInterest, P + totalInterest, dsr, income, schedule);
    }

    function renderResults(firstPayment, totalInterest, totalPayment, dsr, income, schedule) {
        document.getElementById('firstPayment').innerText = formatCurrency(firstPayment) + ' 원';
        document.getElementById('totalInterest').innerText = formatCurrency(totalInterest) + ' 원';
        document.getElementById('totalPayment').innerText = formatCurrency(totalPayment) + ' 원';
        
        const dsrText = income > 0 ? dsr.toFixed(2) + ' %' : '소득 미입력';
        document.getElementById('dsrValue').innerText = dsrText;

        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = ''; // 초기화

        schedule.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.round}회</td>
                <td>${formatCurrency(row.principal)}원</td>
                <td>${formatCurrency(row.interest)}원</td>
                <td><strong>${formatCurrency(row.payment)}원</strong></td>
                <td>${formatCurrency(row.balance)}원</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
